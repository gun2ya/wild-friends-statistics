name: Refresh Tencent public statistics
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tencent-statistics
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Fetch and validate original JSON
        run: python3 fetch.py
      - name: Publish changed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/hero_rank_list_v2.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh Tencent public statistics'
          git push
