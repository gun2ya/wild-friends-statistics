name: Refresh Wild Rift augment statistics
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Force current augment source collection
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: tencent-statistics
  cancel-in-progress: false
jobs:
  augments:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Collect and validate Wild Rift AAA ARAM only
        id: source
        continue-on-error: true
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            python3 augments.py --force
          else
            python3 augments.py
          fi
      - name: Publish checked snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/augments-*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh Wild Rift augment statistics'
          git pull --rebase origin main
          git push
      - name: Report source failure
        if: steps.source.outcome == 'failure'
        run: exit 1
